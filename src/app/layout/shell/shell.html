<mat-sidenav-container class="layout">
  <mat-sidenav class="sidenav" [mode]="'side'" [opened]="isSidenavOpen()">
    <div class="brand">
      <div class="brand-badge"><mat-icon>verified</mat-icon></div>
      <div class="brand-text">
        <div class="title">ERecruitment</div>
        <div class="subtitle">SaaS Platform</div>
      </div>
    </div>

    <div class="nav-label">Menu</div>
    <nav class="nav">
      <a class="nav-item"
         *ngFor="let item of menu()"
         (click)="go(item.path)"
         [class.active]="item.path === activePath()">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidenav-footer">
      <div class="userbox" *ngIf="user() as u">
        <div class="avatar">{{ initials(u.fullName) }}</div>
        <div class="who">
          <div class="name">{{ u.fullName }}</div>
          <div class="meta">{{ u.email }}</div>
        </div>
      </div>

      <button mat-stroked-button class="logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="content-wrap">
    <header class="topbar">
      <button mat-icon-button class="menu-toggle" (click)="toggleSidenav()" matTooltip="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="topbar-title">{{ pageTitle() }}</div>
      <span class="spacer"></span>
      <span class="role-chip">
        <mat-icon>shield</mat-icon>
        {{ role() }}
      </span>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
