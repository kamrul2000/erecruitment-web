<div class="auth-page">
  <mat-card class="auth-card">
    <div class="auth-brand">
      <div class="auth-badge"><mat-icon>verified</mat-icon></div>
      <div>
        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Sign in to your ERecruitment workspace</div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Tenant slug</mat-label>
        <mat-icon matPrefix>apartment</mat-icon>
        <input matInput formControlName="tenantSlug" placeholder="e.g. acme" />
        <mat-error *ngIf="form.controls.tenantSlug.touched && form.controls.tenantSlug.invalid">
          Tenant slug is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>mail</mat-icon>
        <input matInput formControlName="email" placeholder="you@company.com" />
        <mat-error *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())"
                [attr.aria-label]="'Toggle password visibility'">
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password is required (min 6 chars)
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="auth-submit" [disabled]="loading()">
        <ng-container *ngIf="!loading(); else spinner">Sign in</ng-container>
        <ng-template #spinner><mat-spinner diameter="22"></mat-spinner></ng-template>
      </button>
    </form>

    <div class="auth-foot">SaaS owner? <a routerLink="/saas/login">SuperAdmin login</a></div>
    <div class="auth-hint">Use your tenant slug + email + password.</div>
  </mat-card>
</div>
