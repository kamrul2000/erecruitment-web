<div class="page-head">
  <div class="titles">
    <h1>Jobs</h1>
    <div class="sub">Create and manage job postings</div>
  </div>
  <div class="head-actions">
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Add job
    </button>
  </div>
</div>

<mat-card class="list-card">
  <div class="list-toolbar">
    <mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (input)="onSearch($any($event.target).value)" placeholder="Search title, department, status…" />
    </mat-form-field>
    <span class="count muted" *ngIf="!loading()">{{ total() | number }} total</span>
  </div>

  <div class="table-wrap" *ngIf="!loading(); else busy">
    <table mat-table [dataSource]="filtered()" class="table">

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Title </th>
        <td mat-cell *matCellDef="let j">
          <div class="cell-main">{{ j.title }}</div>
          <div class="cell-sub">{{ j.description || '' }}</div>
        </td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef> Department </th>
        <td mat-cell *matCellDef="let j">{{ j.department }}</td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef> Location </th>
        <td mat-cell *matCellDef="let j">{{ j.location || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let j">
          <span class="pill" [ngClass]="statusClass(j.status)">{{ j.status }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef> Created </th>
        <td mat-cell *matCellDef="let j">
          {{ j.createdAt | date:'medium' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-col"> Actions </th>
        <td mat-cell *matCellDef="let j" class="actions-col">
          <button mat-icon-button (click)="openEdit(j)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(j)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div class="empty-state" *ngIf="filtered().length === 0">
      No jobs found.
    </div>

    <mat-paginator
      [length]="total()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50, 100]"
      (page)="onPage($event)">
    </mat-paginator>
  </div>

  <ng-template #busy>
    <div class="busy-center">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  </ng-template>
</mat-card>
